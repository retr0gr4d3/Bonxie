name: Build Bonxie

on:
  push:
    branches:
      - main
      - feature/advanced-stats-metrics
      - feature/client-intelligence-suite
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build solution (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore Skua.sln

      - name: Build solution
        run: dotnet build Skua.sln --configuration Release --no-restore --verbosity minimal

  build-linux:
    name: Build Linux client (.NET 10 / Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and package for linux-x64
        run: bash package-linux.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: Bonxie-linux-x64
          path: Build/Bonxie-*-linux-x64.tar.gz
